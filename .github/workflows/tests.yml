name: tests

on:
  push:
    branches: [main, "release/0.2.9"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q install.py termax tools tests
      - name: Check internal bootstrap shell syntax\n        run: bash -n termax/bootstrap.sh\n      - name: Run tests
        run: python -m unittest discover -s tests -v
